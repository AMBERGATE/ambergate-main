<div class="services-3d-wrapper">
  <!-- Fixed Floating Navigation Arrow Controls -->
  <div class="nav-arrow-controls">
    <button 
      class="nav-arrow-btn prev-btn" 
      (click)="navigatePrev()" 
      title="Previous Section"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
    <div class="nav-divider"></div>
    <button 
      class="nav-arrow-btn next-btn" 
      (click)="navigateNext()" 
      title="Next Section"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>

  <!-- Hero Showcase Section (Section 0) occupying main view below header -->
  <section class="viewport-section hero-showcase-section" id="section-0">
    <div class="hero-brand-card">
      <span class="hero-badge">PREMIUM SITE SERVICES</span>
      <h1 class="hero-main-title">COMMERCIAL DEMOLITION & LOGISTICS</h1>
      <p class="hero-subtitle">High-performance fleet & certified environmental execution across South Florida.</p>
    </div>

    <!-- Centered Bottom Scroll Indicator -->
    <div class="hero-bottom-scroll">
      <span>SCROLL TO DISCOVER SERVICES</span>
      <div class="mouse-icon">
        <div class="wheel"></div>
      </div>
    </div>
  </section>

  <!-- 4 Standalone Modular Service Cards with Independent 3D Cubes -->
  <section 
    *ngFor="let item of servicesList; let i = index" 
    class="viewport-section" 
    [id]="'section-' + (i + 1)"
  >
    <app-service-card 
      [serviceData]="item" 
      [alignRight]="i % 2 === 0"
      [currentIndex]="i + 1"
      [totalServices]="servicesList.length"
      (navigateRequested)="scrollToSection($event)"
    ></app-service-card>
  </section>
</div>
