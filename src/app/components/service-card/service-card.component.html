<div class="service-card-wrapper" [class.align-right]="alignRight">
  <!-- 3D Cube Canvas Container for this specific service -->
  <div class="cube-canvas-container">
    <canvas #cubeCanvas></canvas>

    <!-- Sleek Horizontal Phase Bar Overlay under Canvas -->
    <div class="canvas-phase-bar" title="Seleccionar Fase 3D">
      <button 
        *ngFor="let phase of [1, 2, 3, 4]; let idx = index"
        class="canvas-phase-pill"
        [class.active]="activePhaseIndex === phase"
        (click)="selectPhase(phase)"
        [title]="'Fase ' + phase + ': ' + phaseTitles[idx]"
        [attr.aria-label]="'Fase ' + phase + ': ' + phaseTitles[idx]"
      >
        <span class="pill-bar"></span>
      </button>
    </div>
  </div>

  <!-- Clean Professional Corporate Information Card -->
  <div class="pro-card">
    <div class="card-header">
      <span class="card-step">{{ serviceData.step }}</span>
      <span class="card-badge">{{ serviceData.badge }}</span>
    </div>
    <h2 class="card-title">{{ serviceData.title }}</h2>
    
    <!-- SISTEMA DE FASES DE DEMOLICIÓN INTERACTIVO POR BOTONES -->
    <div class="divition" title="Seleccionar Fase de Demolición">
      <button 
        *ngFor="let phase of [1, 2, 3, 4]"
        class="phase-dot" 
        [class.active]="activePhaseIndex === phase"
        (click)="selectPhase(phase)"
        [attr.aria-label]="'Ver Fase ' + phase"
        [title]="'Fase ' + phase">
      </button>
    </div>

    <p class="card-description">
      {{ serviceData.description }}
    </p>
    
    <div class="card-stats">
      <div class="stat-item">
        <span class="stat-value">{{ serviceData.stat1Value }}</span>
        <span class="stat-label">{{ serviceData.stat1Label }}</span>
      </div>
      <div class="stat-item">
        <span class="stat-value">{{ serviceData.stat2Value }}</span>
        <span class="stat-label">{{ serviceData.stat2Label }}</span>
      </div>
    </div>
    
    <div class="card-footer">
      <div class="card-tags">
        <span *ngFor="let tag of serviceData.tags">{{ tag }}</span>
      </div>

      <div class="card-action-bar">
        <div class="action-divider"></div>
        <button class="btn-card-quote-gold" (click)="scrollToContact()">
          REQUEST QUOTE &rarr;
        </button>
      </div>
    </div>
  </div>
</div>
