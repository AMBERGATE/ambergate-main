<div class="hero-header" [class.scrolled]="isScrolled()" [class.dark-bg]="isDarkSection()">
  <div class="header-inner">
    <div class="header-logo-container">
      <img src="./assets/img/logo-transparent-svg.svg" alt="AMBERGATE USA" class="hero-logo" />
    </div>

    <div class="header-cta-wrapper" [class.visible]="showStickyCta()">
      <button class="header-cta-btn" (click)="scrollToContact()">
        <span>GET AN EXPEDITED QUOTE</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="arrow-icon">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <div class="ola">
    <svg
      class="waves"
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      viewBox="0 24 150 28"
      preserveAspectRatio="none"
      shape-rendering="auto"
    >
      <defs>
        <path
          id="gentle-wave"
          d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z"
        />
      </defs>
      <g class="parallax">
        <use
          xlink:href="#gentle-wave"
          x="48"
          y="0"
          fill="rgba(219,166,34,0.08)"
        />
        <use
          xlink:href="#gentle-wave"
          x="48"
          y="3"
          fill="rgba(255,255,255,0.06)"
        />
        <use
          xlink:href="#gentle-wave"
          x="48"
          y="5"
          fill="rgba(255,255,255,0.12)"
        />
        <use xlink:href="#gentle-wave" x="48" y="7" fill="#FAFAFA" />
      </g>
    </svg>
  </div>
</div>

<app-services3d></app-services3d>

<app-footer></app-footer>
